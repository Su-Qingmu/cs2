name: Build CS2 ESP (SDL2 + ImGui, bilingual)

# The fork keeps the upstream sources in sync and publishes one release that
# carries both an English (cs2-en.exe) and a Chinese (cs2-cn.exe) binary.
#
# The Chinese binary is produced from the *same* commit as the English one:
# scripts/translate_menu.py rewrites the user facing strings of menu.hpp using
# i18n/zh_map.json right before the Chinese build starts. There is no second
# branch to keep in sync and no patch that can silently stop applying.
#
# This workflow is also the dispatch target of .github/workflows/update-files.yml.
# It must therefore keep its workflow_dispatch trigger (and the force_build /
# source_sha inputs) or the offset updater fails with
# "HTTP 422: Workflow does not have 'workflow_dispatch' trigger".

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release even if upstream is unchanged'
        required: false
        type: boolean
        default: false
      source_sha:
        description: 'Exact commit to build (used by the offset updater)'
        required: false
        type: string
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'external-cheat-base/**'
      - 'tests/**'
      - 'web-radar/**'
      - 'radar-relay/**'
      - 'deploy/public-relay/**'
      - 'docs/public-radar-relay-design.md'
      - 'vendor/civetweb/**'
      - 'scripts/**'
      - 'i18n/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - '.github/workflows/build.yaml'
      - '!external-cheat-base/generated/**'
  schedule:
    # 16:00 UTC = 00:00 China Standard Time.
    - cron: '0 16 * * *'

permissions:
  contents: write

concurrency:
  group: build-bilingual-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream and plan the release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # YY.M.D -- year without the "20" prefix, month/day without padding.
          ts="$(date -u +%Y-%m-%d)"
          y="${ts:2:2}"
          m="$(date -u +%-m)"
          d="$(date -u +%-d)"
          echo "tag=${y}.${m}.${d}" >> "$GITHUB_OUTPUT"
          echo "Release tag for this run: ${y}.${m}.${d}"

      - name: Plan the build
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force_build }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tiansongyu/cs2_cheat.git
          git fetch --no-tags upstream main
          git fetch origin main

          if [[ -n "${REQUESTED_SHA}" ]]; then
            # An explicit commit was requested (the offset updater does this).
            # Build exactly that commit and never touch main.
            echo "source_sha=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building explicitly requested commit ${REQUESTED_SHA}."
            exit 0
          fi

          git checkout -B main origin/main
          upstream_sha="$(git rev-parse upstream/main)"
          upstream_changed=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream has new commits (${upstream_sha}); merging into the fork."
            if ! git merge --no-edit --no-ff \
              -m "Sync upstream: ${upstream_sha}" upstream/main; then
              # The fork owns .github/workflows/build.yaml: that file carries the
              # bilingual pipeline and must never be replaced by the upstream
              # single-language one.
              if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/build.yaml'; then
                echo "Keeping the bilingual build workflow over the upstream one."
                git checkout --ours -- .github/workflows/build.yaml
                git add .github/workflows/build.yaml
              fi
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "Unresolved conflicts:" >&2
                git diff --name-only --diff-filter=U >&2
                exit 1
              fi
              git commit --no-edit
            fi
            git push origin HEAD:main
            upstream_changed=true
          else
            echo "Upstream is already synchronized with the fork."
          fi

          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

          if [[ "${FORCE_BUILD}" == "true" || "${upstream_changed}" == "true" || "${EVENT_NAME}" == "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed upstream; skipping the build and release."
          fi

  unit-tests:
    name: Unit tests and Web Radar bundle
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Verify generated fixed-map catalog
        run: python3 scripts/generate_fixed_map_catalog.py --check

      - name: Build viewport regression tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iexternal-cheat-base/src \
            tests/viewport_math_tests.cpp \
            -o viewport_math_tests

      - name: Run viewport regression tests
        run: ./viewport_math_tests

      - name: Build and run runtime timing tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iexternal-cheat-base/src \
            tests/runtime_timing_tests.cpp \
            -o runtime_timing_tests
          ./runtime_timing_tests

      - name: Build Web Radar model regression tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iexternal-cheat-base/src \
            tests/web_radar_model_tests.cpp \
            external-cheat-base/src/core/game/web_radar_json.cpp \
            -o web_radar_model_tests

      - name: Run Web Radar model regression tests
        run: ./web_radar_model_tests

      - name: Run menu translation regression tests
        run: python3 tests/translate_menu_tests.py

      - name: Build and run embedded service smoke tests
        run: |
          mkdir -p /tmp/web-radar-smoke
          gcc -std=c11 -O2 \
            -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
            -Ivendor/civetweb/include \
            -c vendor/civetweb/src/civetweb.c \
            -o /tmp/web-radar-smoke/civetweb.o
          g++ -std=c++20 -O2 \
            -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
            -Ivendor/civetweb/include \
            -c vendor/civetweb/src/CivetServer.cpp \
            -o /tmp/web-radar-smoke/CivetServer.o
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -DNO_SSL -DNO_CGI -DUSE_WEBSOCKET -DUSE_IPV6 \
            -Ivendor/civetweb/include \
            -Iexternal-cheat-base/src \
            -Iexternal-cheat-base/src/features/web_radar \
            external-cheat-base/src/features/web_radar/tests/web_radar_service_smoke_tests.cpp \
            external-cheat-base/src/features/web_radar/web_radar_service.cpp \
            /tmp/web-radar-smoke/civetweb.o \
            /tmp/web-radar-smoke/CivetServer.o \
            -pthread -ldl \
            -o /tmp/web-radar-smoke/web_radar_service_smoke_tests
          /tmp/web-radar-smoke/web_radar_service_smoke_tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-radar/package-lock.json

      - name: Test and build Web Radar frontend
        working-directory: web-radar
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate Web Radar static bundle
        working-directory: web-radar
        run: node scripts/validate-bundle.mjs dist

      - name: Upload Web Radar static bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-radar-static
          path: web-radar/dist
          if-no-files-found: error
          retention-days: 1

  public-relay-tests:
    name: Radar Relay tests
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: radar-relay/go.mod
          cache-dependency-path: radar-relay/go.sum

      - name: Test public deployment credential generator
        working-directory: radar-relay
        run: |
          go build -mod=vendor -trimpath -o "$RUNNER_TEMP/radar-relay" ./cmd/radar-relay
          RADAR_RELAY_BIN="$RUNNER_TEMP/radar-relay" \
            ../deploy/public-relay/tests/generate-room-config_test.sh \
            ../deploy/public-relay/generate-room-config.sh

      - name: Test Radar Relay with race detector
        working-directory: radar-relay
        run: go test -mod=vendor -race ./...

      - name: Vet Radar Relay
        working-directory: radar-relay
        run: go vet -mod=vendor ./...

      - name: Scan Radar Relay for known Go vulnerabilities
        working-directory: radar-relay
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build production Radar Relay image
        run: docker build -f radar-relay/Dockerfile -t cs2-radar-relay:ci .

      - name: Build and verify capability-free Caddy image
        run: |
          docker build \
            -f deploy/public-relay/Caddy.Dockerfile \
            -t cs2-radar-caddy:ci \
            deploy/public-relay
          docker run --rm \
            --user 65532:65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            cs2-radar-caddy:ci caddy version
          docker run --rm \
            -e RADAR_DOMAIN=radar.example.com \
            -e ACME_EMAIL=admin@example.net \
            -v "$PWD/deploy/public-relay/Caddyfile:/etc/caddy/Caddyfile:ro" \
            cs2-radar-caddy:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate public deployment configuration
        run: |
          shellcheck \
            deploy/public-relay/generate-room-config.sh \
            deploy/public-relay/tests/generate-room-config_test.sh \
            deploy/public-relay/verify-deployment.sh
          RELAY_CONFIG_FILE=./relay-config.example.json docker compose \
            --env-file deploy/public-relay/.env.example \
            -f deploy/public-relay/compose.yaml \
            config --quiet

  build-en:
    name: Build English binary
    needs: [sync, unit-tests]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Download Web Radar static bundle
        uses: actions/download-artifact@v4
        with:
          name: web-radar-static
          path: web-radar/dist

      - name: Setup Node.js for bundle validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build EXE
        shell: cmd
        run: msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

      - name: Verify release layout
        shell: pwsh
        run: |
          $required = @(
            "x64/Release/external-cheat-base.exe",
            "x64/Release/SDL2.dll",
            "x64/Release/CIVETWEB-LICENSE.md",
            "x64/Release/web-radar/dist/index.html",
            "x64/Release/web-radar/dist/maps/manifest.json",
            "x64/Release/web-radar/dist/maps/SOURCE.json",
            "x64/Release/web-radar/dist/maps/NOTICE.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing release artifact: $path"
            }
          }
          node web-radar/scripts/validate-bundle.mjs x64/Release/web-radar/dist
          if ($LASTEXITCODE -ne 0) {
            throw "Copied Web Radar bundle validation failed"
          }

      - name: Rename to cs2-en.exe
        shell: pwsh
        run: |
          Move-Item -Force "x64/Release/external-cheat-base.exe" "x64/Release/cs2-en.exe"

      - name: Upload English package
        uses: actions/upload-artifact@v4
        with:
          name: en-build
          path: x64/Release
          if-no-files-found: error
          retention-days: 1

  build-zh:
    name: Build Chinese binary
    needs: [sync, unit-tests]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Download Web Radar static bundle
        uses: actions/download-artifact@v4
        with:
          name: web-radar-static
          path: web-radar/dist

      - name: Setup Node.js for bundle validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Translate the menu for the Chinese build
        run: |
          python scripts/translate_menu.py `
            --map i18n/zh_map.json `
            --source external-cheat-base/src/features/menu.hpp `
            --in-place `
            --strict

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build EXE
        shell: cmd
        run: msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

      - name: Verify release layout
        shell: pwsh
        run: |
          $required = @(
            "x64/Release/external-cheat-base.exe",
            "x64/Release/SDL2.dll",
            "x64/Release/CIVETWEB-LICENSE.md",
            "x64/Release/web-radar/dist/index.html"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing release artifact: $path"
            }
          }

      - name: Rename to cs2-cn.exe
        shell: pwsh
        run: |
          Move-Item -Force "x64/Release/external-cheat-base.exe" "x64/Release/cs2-cn.exe"

      - name: Upload Chinese package
        uses: actions/upload-artifact@v4
        with:
          name: zh-build
          path: x64/Release
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish bilingual release
    needs: [sync, build-en, build-zh]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download English package
        uses: actions/download-artifact@v4
        with:
          name: en-build
          path: en-build

      - name: Download Chinese package
        uses: actions/download-artifact@v4
        with:
          name: zh-build
          path: zh-build

      - name: Combine into a single bilingual archive
        shell: pwsh
        run: |
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Recurse -Force "en-build/*" "$releaseDir/"
          Copy-Item -Recurse -Force "zh-build/*" "$releaseDir/"
          Get-ChildItem -Path $releaseDir | Format-Table Name, Length
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "cs2-bilingual.zip"

      - name: Point the release tag at the built source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ] || [ -z "${SOURCE_SHA}" ]; then
            echo "RELEASE_TAG and SOURCE_SHA must both be set." >&2
            exit 1
          fi
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          if gh api "$ref" >/dev/null 2>&1; then
            echo "Updating existing tag '${RELEASE_TAG}' to ${SOURCE_SHA}"
            gh api --method PATCH "$ref" \
              -f sha="${SOURCE_SHA}" \
              -F force=true >/dev/null
          else
            echo "Creating tag '${RELEASE_TAG}' at ${SOURCE_SHA}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${SOURCE_SHA}" >/dev/null
          fi

      - name: Publish the bilingual release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: Build ${{ needs.sync.outputs.tag }}
          body: |
            Bilingual daily build.
            - English binary: `cs2-en.exe`
            - Chinese binary: `cs2-cn.exe`
            - Source SHA: ${{ needs.sync.outputs.source_sha }}
            - Tag: ${{ needs.sync.outputs.tag }}
          files: cs2-bilingual.zip
          overwrite_files: true
          make_latest: true
