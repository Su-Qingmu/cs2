name: Sync Upstream and Publish Daily EXE

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      source_sha: ${{ steps.sync.outputs.source_sha }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check upstream and merge if changed
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tiansongyu/cs2_cheat.git
          git fetch --no-tags upstream main
          git fetch origin main
          git checkout -B main origin/main

          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already synchronized with fork HEAD; skipping build and release today."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has new commits (${upstream_sha}); merging into fork."
            git merge --no-edit --no-ff \
              -m "Sync upstream: ${upstream_sha}" upstream/main
            git push origin HEAD:main
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Compute release tag
        id: date
        shell: bash
        run: |
          # YY.M.D — year without "20" prefix, month/day without leading zeros
          ts="$(date -u +%Y-%m-%d)"
          y="${ts:2:2}"
          m="$(date -u +%-m)"
          d="$(date -u +%-d)"
          echo "tag=${y}.${m}.${d}" >> "$GITHUB_OUTPUT"
          echo "Release tag for this run: ${y}.${m}.${d}"

      - name: Checkout synchronized source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-radar/package-lock.json

      - name: Build Web Radar
        working-directory: web-radar
        run: |
          npm ci
          npm test
          npm run build
          node scripts/validate-bundle.mjs dist

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release EXE
        shell: cmd
        run: msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: cs2-exe-latest
          path: x64/Release
          if-no-files-found: error

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path x64/Release/* -DestinationPath cs2-exe-latest.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: latest-release-package
          path: cs2-exe-latest.zip
          if-no-files-found: error

  release:
    needs: [sync, build]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: latest-release-package
          path: release-package

      - name: Point release tag at synchronized source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          # Probe tag existence via HTTP status code. `gh api` exits non-zero on 4xx,
          # and `set -e` + `pipefail` would abort before we branch — so swallow the
          # pipeline failure with `|| true` and default to "000" for any error path.
          status="$(gh api "$ref" -i 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          status="${status:-000}"
          if [[ "$status" == "200" ]]; then
            echo "Updating existing '${RELEASE_TAG}' tag to ${SOURCE_SHA}"
            gh api --method PATCH "$ref" \
              -f sha="${SOURCE_SHA}" \
              -F force=true >/dev/null
          else
            echo "Creating '${RELEASE_TAG}' tag at ${SOURCE_SHA}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${SOURCE_SHA}" >/dev/null
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Build ${{ needs.build.outputs.tag }}
          body: |
            Automatically built from the latest synchronized upstream source.
            - Source SHA: ${{ needs.sync.outputs.source_sha }}
            - Tag: ${{ needs.build.outputs.tag }}
          files: release-package/cs2-exe-latest.zip
          overwrite_files: true
          make_latest: true