name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-radar/package-lock.json

      - name: Build Web Radar
        working-directory: web-radar
        run: |
          npm ci
          npm test
          npm run build
          node scripts/validate-bundle.mjs dist

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release EXE
        shell: cmd
        run: msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: cs2-exe-x64-release
          path: x64/Release
          if-no-files-found: error

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path x64/Release/* -DestinationPath cs2-exe-x64-release.zip

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: cs2-exe-x64-release.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-package/cs2-exe-x64-release.zip
